<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore</title>
    <head>
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      />
      <link rel="stylesheet" href="style.css" />
    </head>
  </head>
  <body>
    <!-- Cabeçalho -->
    <header>
      <div class="logo">
        <i class="fa-solid fa-bolt"></i>
        <h1>TechStore</h1>
      </div>

      <div class="container-busca">
        <input placeholder="Buscar produto" class="input-pesquisa">
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </header>

    <!-- Menu  opções-->
    <div class="menu">
      <nav>
        <button class="botao-categorias ativo" data-categoria="todos">
          <i class="fa-solid fa-border-all"></i> Todos
        </button>

        <button class="botao-categorias" data-categoria="smartphones">
          <i class="fa-solid fa-mobile-screen-button"></i>Celulares
        </button>

        <button class="botao-categorias" data-categoria="laptops">
          <i class="fa-solid fa-laptop"></i> Notebooks
        </button>

        <button class="botao-categorias" data-categoria="accessories">
          <i class="fa-solid fa-keyboard"></i>Acessórios
        </button>

        <button class="botao-categorias" data-categoria="smartwatch">
          <i class="fa-solid fa-clock"></i>Wereables
        </button>
      </nav>
    </div>

    <!-- Seção de Promoção -->
    <div class="secao-hero">
      <h2>Black Friday Antecipada!</h2>
      <p>Até 50% de desconto em produtos selecionados!</p>
    </div>

    <!--  Menu de proutos  -->
    <div class="produtos">
      <div class="produtos-container">

        </div>
      </div>

    <!--  Rodapé  -->
    <footer>
      <p>2026 &copy; TechStore</p>
    </footer>
  </body>
  <script src="script.js"></script>
</html>
